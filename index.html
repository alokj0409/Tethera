<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#111215">
    <title>TETHERA</title>
    <style>
      :root {
        color-scheme: dark;
        background: #111215;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #111215;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #viewport {
        position: fixed;
        inset: 0;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-right: env(safe-area-inset-right);
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        padding-left: env(safe-area-inset-left);
      }

      #stage {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      #game {
        display: block;
        flex: none;
        background: #111215;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <main id="viewport" aria-label="TETHERA game">
      <div id="stage">
        <canvas id="game" role="img" aria-label="TETHERA game canvas"></canvas>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
